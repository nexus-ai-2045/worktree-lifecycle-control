[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "worktree-lifecycle-control"
version = "0.1.0"
description = "Read-only Git worktree lifecycle inventory and cleanup readiness gate"
requires-python = ">=3.11"
dependencies = [
  # Windows GitHub Actions / clean CPython need IANA tzdb for ZoneInfo("Asia/Tokyo").
  "tzdata>=2024.1",
]

[project.optional-dependencies]
test = [
  "jsonschema>=4.23,<5",
  # jsonschema の FormatChecker は date-time を検査するのにこれを要る。
  # 無いと format 検査が例外も警告も出さずに no-op になる。
  "rfc3339-validator>=0.1.4",
  "pytest>=8.2,<9",
]

[project.scripts]
worktree-lifecycle = "worktree_lifecycle_control.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
