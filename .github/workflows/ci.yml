name: CI

on:
  pull_request:
  push:
  # 時限爆弾は「変更で発火するテスト」では捕まらない。リポジトリが静かなほど
  # 腐敗が緑のまま隠れる。2026-08-13 に発火した now= 未固定のテストが、CI が
  # 8/6 以降起動していなかったため 2 日間 気付かれなかった実例がある。
  # 時間で起動する経路を置き、無変更でも腐敗を検出する。
  schedule:
    - cron: "17 21 * * 1"  # 毎週月曜 21:17 UTC (= 火曜 06:17 JST)
  workflow_dispatch:

permissions:
  contents: read

env:
  # repo-preflight 上流の検査ロジック正本（コピーしない）。SHA 固定 + checkout 後に照合。
  REPO_PREFLIGHT_SHA: acf8cadd6822498f8ffa737a140ed76bdea81f6f

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Validate JSON Schemas
        shell: python
        run: |
          import json
          import tempfile
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker
          from referencing import Registry, Resource
          from worktree_lifecycle_control.cli import main

          schemas = {}
          registry = Registry()
          for path in Path("schemas").glob("*.schema.json"):
              schema = json.loads(path.read_text(encoding="utf-8"))
              Draft202012Validator.check_schema(schema)
              resource = Resource.from_contents(schema)
              registry = registry.with_resource(schema["$id"], resource).with_resource(path.name, resource)
              schemas[path.name] = schema

          checker = FormatChecker()
          # format 検査は依存が無いと黙って no-op になる。date-time が実際に
          # 効いていることを先に確かめる。ここが通らない限り以降の検証は無意味。
          assert not checker.conforms("not-a-timestamp", "date-time"), (
              "date-time format checking is a no-op; rfc3339-validator is missing"
          )
          example = json.loads(Path("registry.example.json").read_text(encoding="utf-8"))
          Draft202012Validator(schemas["registry-v2.schema.json"], registry=registry, format_checker=checker).validate(example)
          with tempfile.TemporaryDirectory() as temporary:
              root = Path(temporary)
              scan_path = root / "scan.json"
              review_path = root / "review.json"
              assert main(["scan", "--repo", ".", "--registry", "registry.example.json", "--report-path", str(scan_path), "--json"]) == 0
              assert main(["review-packet", "--repo", ".", "--registry", "registry.example.json", "--report-path", str(review_path), "--json"]) == 0
              for payload_path, schema_name in ((scan_path, "scan-report-v3.schema.json"), (review_path, "review-packet-v3.schema.json")):
                  payload = json.loads(payload_path.read_text(encoding="utf-8"))
                  Draft202012Validator(schemas[schema_name], registry=registry, format_checker=checker).validate(payload)
      - name: Compile package
        run: python -m compileall -q src
      - name: Run tests
        run: python -m pytest

  # 本流と同じ開発保証。検査ロジックは上流のまま。engineering-brain は埋め込まない。
  repository-guarantees:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Resolve consistency base-ref (empty-diff fail-closed on dispatch)
        id: consistency
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          HEAD="$(git rev-parse HEAD)"
          BASE=""
          case "$EVENT_NAME" in
            pull_request)
              BASE="$PR_BASE_SHA"
              ;;
            push)
              BASE="$BEFORE_SHA"
              ;;
            schedule)
              # 無変更 schedule でも腐敗検出経路を残す。直近親と比較。
              BASE="$(git rev-parse HEAD~1)"
              ;;
            workflow_dispatch)
              if [ -n "${PR_BASE_SHA:-}" ]; then
                BASE="$PR_BASE_SHA"
              elif [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
                BASE="$BEFORE_SHA"
              else
                git fetch --no-tags origin "${{ github.event.repository.default_branch }}"
                BASE="$(git rev-parse "origin/${{ github.event.repository.default_branch }}")"
              fi
              ;;
            *)
              echo "unsupported event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "consistency base-ref を解決できない → fail-closed" >&2
            exit 1
          fi
          BASE_RESOLVED="$(git rev-parse "$BASE")"
          # #127 相当: dispatch で BASE==HEAD（空 diff）なら落とす。緑の空振りを防ぐ。
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$BASE_RESOLVED" = "$HEAD" ]; then
            echo "空diff fail-closed: workflow_dispatch で BASE==HEAD ($HEAD)" >&2
            exit 1
          fi
          echo "base_ref=$BASE_RESOLVED" >> "$GITHUB_OUTPUT"
          echo "Resolved consistency base_ref=$BASE_RESOLVED head=$HEAD event=$EVENT_NAME"

      - name: Fetch pinned repo-preflight (no logic copy)
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/nexus-ai-2045/repo-preflight.git "$RUNNER_TEMP/repo-preflight"
          git -C "$RUNNER_TEMP/repo-preflight" checkout --detach "$REPO_PREFLIGHT_SHA"
          test "$(git -C "$RUNNER_TEMP/repo-preflight" rev-parse HEAD)" = "$REPO_PREFLIGHT_SHA"

      - name: Install pinned ai-ratchet-gate wheel
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-tools.txt

      - name: Smoke-check ai-ratchet-gate CLI
        run: |
          set -euo pipefail
          python -m ai_ratchet_gate --help | grep -F "tracked∧ignored"

      - name: ai-ratchet-gate (tracked∧ignored, fail-closed on new debt)
        run: python -m ai_ratchet_gate --repo .

      - name: repo-preflight readiness_scan (evidence)
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/repo-preflight/scripts/readiness_scan.py" \
            --repo . > "$RUNNER_TEMP/readiness.json"
          python - <<'PY'
          import json
          import os
          import pathlib
          import sys

          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "readiness.json"
          payload = json.loads(path.read_text(encoding="utf-8"))
          status = payload.get("status")
          print(f"readiness_scan status={status!r}")
          # tool_error だけ fail-closed。blocked/pass は証拠として残し、merge 承認にはしない。
          if status == "tool_error":
              sys.exit(1)
          PY

      - name: repo-preflight consistency_gate
        env:
          CONSISTENCY_BASE: ${{ steps.consistency.outputs.base_ref }}
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/repo-preflight/scripts/consistency_gate.py" \
            --repo . \
            --base-ref "$CONSISTENCY_BASE" \
            --require-config \
            --require-mode shadow \
            --json > "$RUNNER_TEMP/consistency.json"
          python - <<'PY'
          import json
          import os
          import pathlib
          import sys

          payload = json.loads(
              (pathlib.Path(os.environ["RUNNER_TEMP"]) / "consistency.json").read_text(
                  encoding="utf-8"
              )
          )
          status = payload.get("status")
          mode = payload.get("mode")
          print(f"consistency_gate status={status!r} mode={mode!r}")
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          # shadow: 所見は止めない。設定欠落・mode 弱体化・tool_error・enforce 相当 fail は止める。
          if status in {"pass", "shadow_findings"}:
              sys.exit(0)
          sys.exit(1)
          PY
