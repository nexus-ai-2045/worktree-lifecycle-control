<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">worktree を消したとき、git が守るものと守らないもの</title>
  <desc id="desc">未 push は branch が残る。dirty は git が拒否する。detached で ref が無いものだけ無警告で消える。</desc>
  <rect x="16" y="24" width="288" height="232" rx="12" fill="#f4f6f8" stroke="#c5ccd4"/>
  <text x="160" y="64" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#1f2933">未 push</text>
  <text x="160" y="108" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#3d4a54">消しても branch が残る</text>
  <text x="160" y="168" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#3d4a54">commit も復元できる</text>
  <text x="160" y="220" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#2f6f4e">守る必要なし</text>

  <rect x="336" y="24" width="288" height="232" rx="12" fill="#f4f6f8" stroke="#c5ccd4"/>
  <text x="480" y="64" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#1f2933">dirty</text>
  <text x="480" y="108" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#3d4a54">git worktree remove</text>
  <text x="480" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#3d4a54">自身が拒否する</text>
  <text x="480" y="220" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#2f6f4e">git が守る</text>

  <rect x="656" y="24" width="288" height="232" rx="12" fill="#fff6ee" stroke="#d97706" stroke-width="2"/>
  <text x="800" y="64" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#9a3412">detached / ref なし</text>
  <text x="800" y="108" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#7c2d12">無警告で消える</text>
  <text x="800" y="140" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#7c2d12">git gc の後は戻せない</text>
  <text x="800" y="220" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#9a3412">誰も守らない</text>
</svg>
